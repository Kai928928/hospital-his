{% extends "base.html" %}
{% block title %}修改密码 - HIS Pro{% endblock %}
{% block page_title %}修改密码{% endblock %}
{% block content %}
<form method="post" class="account-form">
    <input type="hidden" name="payment_token" value="{{ csrf_token() }}">
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <div class="mb-3"><label for="old-password" class="form-label">原密码</label><input id="old-password" name="old_password" type="password" class="form-control" autocomplete="current-password" required></div>
    <div class="mb-3"><label for="new-password" class="form-label">新密码</label><input id="new-password" name="password" type="password" class="form-control" minlength="8" maxlength="128" autocomplete="new-password" required></div>
    <div class="mb-3"><label for="confirm-password" class="form-label">确认新密码</label><input id="confirm-password" name="confirm_password" type="password" class="form-control" minlength="8" maxlength="128" autocomplete="new-password" required></div>
    <button class="btn btn-primary">保存并重新登录</button>
</form>
{% endblock %}
