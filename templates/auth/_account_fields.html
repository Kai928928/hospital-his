<div class="mb-3"><label for="display-name" class="form-label">姓名</label><input id="display-name" name="display_name" class="form-control" maxlength="64" value="{{ request.form.get('display_name', '') }}" autocomplete="name" required></div>
<div class="mb-3"><label for="username" class="form-label">账号</label><input id="username" name="username" class="form-control" minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_.\-]{2,31}" value="{{ request.form.get('username', '') }}" autocomplete="username" required><div class="form-text">3 至 32 位英文字母、数字、点、下划线或短横线</div></div>
<div class="mb-3"><label for="new-password" class="form-label">密码</label><input id="new-password" name="password" type="password" class="form-control" minlength="8" maxlength="128" autocomplete="new-password" required></div>
<div class="mb-3"><label for="confirm-password" class="form-label">确认密码</label><input id="confirm-password" name="confirm_password" type="password" class="form-control" minlength="8" maxlength="128" autocomplete="new-password" required></div>
